# GhostLock execution tuning for the sendmsg_iovec route (HOCON); include it
# only from profiles whose route (or fallback) is sendmsg_iovec.
#
# enter_delay_us: how long the consumer waits after the trigger is armed before
#                 it touches the waiter task's scheduler attributes. The route
#                 stamps the crafted waiter through sendmsg() immediately, so
#                 this only has to cover the syscall entry.
# timeout_us:     upper bound on one stamp window; after it the route gives up
#                 and the stage retry re-runs it.
execution {
  routes {
    sendmsg_iovec {
      enter_delay_us = 50000
      timeout_us = 200000
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
