# GhostLock execution tuning for the rt_sigreturn route (HOCON); include it
# only from profiles whose route (or fallback) is rt_sigreturn.
#
# enter_delay_us: how long the consumer waits after the trigger is armed before
#                 it touches the waiter task's scheduler attributes.
#                 stamp_and_raise() is synchronous: by the time it returns the
#                 signal handler has already run and __arm64_sys_rt_sigreturn has
#                 copied the FPSIMD save area onto the waiter thread's kernel
#                 stack. That copy is the only thing keeping the stale waiter
#                 fields controlled, and the waiter thread keeps running
#                 afterwards, so a later deep kernel frame reuses that slot.
#                 The consumer must therefore walk the chain immediately: a
#                 50 ms window let the stamped words be overwritten before the
#                 walk, which is what made the route read a garbage
#                 waiter->lock. 0 disables the usleep() so the consumer fires on
#                 the first armed iteration.
# timeout_us:     upper bound on one stamp window; after it the route gives up
#                 and the stage retry re-runs it.
execution {
  routes {
    rt_sigreturn {
      enter_delay_us = 0
      timeout_us = 200000
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
